name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly, catches new HA/HACS requirements between pushes

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        env:
          # The action reads repo files through the GitHub API; on a private
          # repo that needs auth or every file check comes back empty.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          category: integration
          # brands: not registered in home-assistant/brands (icons come from the
          # GitHub avatar fallback); register there later to drop this ignore.
          ignore: brands
